name: Windows PPTX prototype
on:
  push:
    branches: [prototype/windows-native-questions]
    paths: ['prototype/**', 'scripts/inspect_deck.py', '.github/workflows/windows-prototype.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  insert-and-verify:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Insert native question and anonymous poll into existing slides
        run: python -X utf8 prototype/insert.py prototype/fixtures/base.pptx prototype/fixtures/questions.json rain-windows.pptx
      - name: Check contents and slide relationships
        run: python -X utf8 prototype/verify.py prototype/fixtures/base.pptx rain-windows.pptx
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rain-windows
          path: rain-windows.pptx
          if-no-files-found: error
